name: Optimización Avanzada de PNG

on:
  push:
    branches: [ Test ]
    paths: [ '**.png' ]

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y zopfli

      - name: Optimización avanzada con Zopfli
        run: |
          find . -name '*.png' -exec zopflipng \
            -y \
            --iterations=50 \
            --lossy_8bit \
            --lossy_transparent \
            --filters=0me \
            {} {} \;

      - name: Commit y Push de cambios
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add .
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Optimización avanzada de imágenes PNG"
            git push "https://${{ secrets.GH_TOKEN }}@github.com/$https://github.com/Methro/Cefiro-16x/tree/Test.git"
          else
            echo "No hay cambios para commitear"
          fi
