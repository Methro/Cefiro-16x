name: Streamlined PNG Optimisation

on:
  push:
    branches: [ "Test" ]
  workflow_dispatch:

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zopfli file bc

      - name: Validate PNG Files
        run: |
          echo -e "\033[35m╰┈➤ PNG Validation Check\033[0m"
          invalid_files=0
          git ls-files "*.png" | while read -r file_path; do
            if file -b "$file_path" | grep -q 'PNG image'; then
              echo -e "  \033[33m$file_path\033[0m : \033[32m[ ✔ ]\033[0m"
            else
              echo -e "  \033[33m$file_path\033[0m : \033[31m[ ✖ ]\033[0m"
              invalid_files=$((invalid_files + 1))
            fi
          done

          if [ "$invalid_files" -gt 0 ]; then
            echo -e "\n\033[1;41mERROR: $invalid_files invalid PNG file(s) detected\033[0m"
            exit 1
          fi

      - name: PNG Optimisation Process
        run: |
          echo -e "\033[35m╰┈➤ Optimisation Progress\033[0m"
          
          format_size() {
            size=$1
            units='B KB MB GB'
            unit=0
            
            while [ "$(echo "$size >= 1024" | bc)" -eq 1 ] && [ $unit -lt 3 ]; do
              size=$(echo "scale=2; $size / 1024" | bc)
              unit=$((unit + 1))
            done
            
            printf "%.2f%s" "$size" "$(echo "$units" | cut -d' ' -f$((unit + 1)))"
          }

          find . -name '*.png' -exec sh -c '
            format_size() {
              size=$1
              units="B KB MB GB"
              unit=0
              
              while [ "$(echo "$size >= 1024" | bc)" -eq 1 ] && [ $unit -lt 3 ]; do
                size=$(echo "scale=2; $size / 1024" | bc)
                unit=$((unit + 1))
              done
              
              printf "%.2f%s" "$size" "$(echo "$units" | cut -d" " -f$((unit + 1)))"
            }

            for file_path do
              original_bytes=$(stat -c%s "$file_path")
              zopflipng -y --iterations=50 --lossy_8bit --lossy_transparent --filters=0me "$file_path" "$file_path" > /dev/null 2>&1
              optimised_bytes=$(stat -c%s "$file_path")
              
              original_size=$(format_size "$original_bytes")
              optimised_size=$(format_size "$optimised_bytes")

              if [ "$optimised_bytes" -lt "$original_bytes" ]; then
                printf "  \033[34m[ Optimised ]\033[0m \033[33m%s\033[0m : \033[31m%s\033[0m -> \033[32m%s\033[0m\n" \
                "$file_path" "${original_size}" "${optimised_size}"
                echo "$file_path" >> optimised_files.txt
              else
                printf "  \033[34m[ Unoptimised ]\033[0m \033[33m%s\033[0m : \033[35m%s\033[0m\n" \
                "$file_path" "${original_size}"
              fi
            done
          ' sh {} +

      - name: Commit and Push Optimised Files
        if: success()
        run: |
          echo -e "\033[35m╰┈➤ Git Operations\033[0m"
          if [ ! -f optimised_files.txt ]; then
            echo -e "  \033[1;33mNo files were optimised, skipping commit\033[0m"
            exit 0
          fi

          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@users.noreply.github.com"
          
          while read -r file_path; do
            git add "$file_path"
            echo -e "  \033[32mStaged changes for: \033[33m$file_path\033[0m"
          done < optimised_files.txt

          if ! git diff-index --quiet HEAD; then
            git commit -m "Optimised PNG files using Zopfli" -m "Affected files: $(paste -sd, optimised_files.txt)"
            echo -e "  \033[1;32mSuccessfully committed optimised files\033[0m"
            git push "https://${{ secrets.GH_TOKEN }}@github.com/Methro/Cefiro-16x.git" HEAD:Test
          else
            echo -e "  \033[33mNo detectable changes after optimisation\033[0m"
          fi
